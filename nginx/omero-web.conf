# OMERO.web location block for SURF Research Cloud host nginx.
#
# SURF Research Cloud owns the TLS server block. Install this file on the host:
#
#   sudo cp nginx/omero-web.conf /etc/nginx/app-location-conf.d/omero-web.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# Expected host ports:
#   OMERO.web: 4080
#   Metabase: 3000
#   OpenSearch Dashboards: 5601

location / {
    proxy_pass http://127.0.0.1:4080;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Referer $http_referer;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_http_version 1.1;
    proxy_read_timeout 300s;
    proxy_connect_timeout 75s;
    client_max_body_size 0;
}

location /metabase/ {
    proxy_pass http://127.0.0.1:3000/;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /metabase;
    proxy_http_version 1.1;
    proxy_read_timeout 300s;
    proxy_connect_timeout 75s;
    client_max_body_size 0;
}

location = /logs {
    return 301 /logs/;
}

location /logs/ {
    auth_basic "Admin Access - Log Viewer";
    auth_basic_user_file /etc/nginx/.htpasswd;

    proxy_pass http://127.0.0.1:5601;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /logs;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_buffering off;
    proxy_read_timeout 300s;
    proxy_connect_timeout 75s;
    client_max_body_size 0;
}

location = /grafana {
    return 301 /logs/;
}

location /grafana/ {
    return 301 /logs/;
}
