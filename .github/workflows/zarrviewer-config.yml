name: ZarrViewer configuration

on:
  pull_request:
    paths:
      - 'web/55-configure-zarr-viewer.py'
      - 'web/tests/test_zarr_viewer_config.py'
      - 'docker-compose.yml'
      - 'docker-compose-dev.yml'
      - 'deployment_scenarios/docker-compose-for-ubuntu-with-SSL.yml'
      - 'nginx/nginx.conf'
      - 'nginx/zarrviewer.conf'
      - 'web/Dockerfile'
      - '.env'
      - '.env.shared'
      - '.github/workflows/zarrviewer-config.yml'
  push:
    paths:
      - 'web/55-configure-zarr-viewer.py'
      - 'web/tests/test_zarr_viewer_config.py'
      - 'docker-compose.yml'
      - 'docker-compose-dev.yml'
      - 'deployment_scenarios/docker-compose-for-ubuntu-with-SSL.yml'
      - 'nginx/nginx.conf'
      - 'nginx/zarrviewer.conf'
      - 'web/Dockerfile'
      - '.env'
      - '.env.shared'
      - '.github/workflows/zarrviewer-config.yml'

permissions:
  contents: read

jobs:
  feature-transitions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preserve plugins across opt-in and opt-out transitions
        run: python -m unittest discover -s web/tests -p 'test_zarr_viewer_config.py'
      - name: Keep one browser-facing OMERO.web endpoint
        run: |
          docker compose config --format json > /tmp/compose.json
          docker compose -f docker-compose-dev.yml config --format json > /tmp/compose-dev.json
          python - <<'PY'
          import json
          from pathlib import Path

          env = dict(
              line.split("=", 1)
              for line in Path(".env").read_text(encoding="utf-8").splitlines()
              if line and not line.startswith("#") and "=" in line
          )
          viewer_version = env["BIOMERO_ZARR_VIEWER_VERSION"]

          for path in ("/tmp/compose.json", "/tmp/compose-dev.json"):
              with open(path, encoding="utf-8") as handle:
                  services = json.load(handle)["services"]
              assert services["omeroweb"]["build"]["args"]["BIOMERO_ZARR_VIEWER_VERSION"] == viewer_version, path
              assert not services["omeroweb"].get("ports"), path
              ports = services["zarrviewer-nginx"]["ports"]
              assert len(ports) == 1, path
              assert ports[0]["target"] == 4080, path
              assert ports[0]["published"] == "4080", path
              assert not services["zarrviewer-nginx"].get("profiles"), path

          dockerfile = Path("web/Dockerfile").read_text(encoding="utf-8")
          assert 'biomero-zarr-viewer==${BIOMERO_ZARR_VIEWER_VERSION}' in dockerfile
          assert "BIOMERO.ZarrViewer.git@" not in dockerfile
          PY
      - name: Validate the Ubuntu HTTPS viewer integration
        run: |
          docker compose \
            --env-file .env \
            --file deployment_scenarios/docker-compose-for-ubuntu-with-SSL.yml \
            config --format json > /tmp/compose-ssl.json
          python - <<'PY'
          import json
          from pathlib import Path

          with open("/tmp/compose-ssl.json", encoding="utf-8") as handle:
              services = json.load(handle)["services"]

          assert not services["omeroweb"].get("ports")
          assert services["omeroweb"]["environment"]["BIOMERO_ZARR_VIEWER_ENABLED"]
          data_mounts = [
              volume for volume in services["nginx"]["volumes"]
              if volume["target"] == "/data"
          ]
          assert len(data_mounts) == 1
          assert data_mounts[0]["read_only"] is True

          config = Path("nginx/nginx.conf").read_text(encoding="utf-8")
          internal = config.index("location /_biomero_zarr_internal/")
          viewer = config.index("location /biomero_zarr_viewer/")
          assert "internal;" in config[internal:viewer]
          assert "proxy_cache off;" in config[viewer:config.index("location / {", viewer)]
          PY
          mkdir -p /tmp/letsencrypt/live/your.server.org
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
            -subj /CN=your.server.org \
            -keyout /tmp/letsencrypt/live/your.server.org/privkey.pem \
            -out /tmp/letsencrypt/live/your.server.org/fullchain.pem
          docker run --rm \
            --add-host omeroweb:127.0.0.1 \
            --add-host metabase:127.0.0.1 \
            --mount type=bind,source="$PWD/nginx/nginx.conf",target=/etc/nginx/nginx.conf,readonly \
            --mount type=bind,source=/tmp/letsencrypt,target=/etc/letsencrypt,readonly \
            nginx:alpine nginx -t
