---
name: Compose configuration

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compose-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose-config:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DQW_API_TOKEN: ci-compose-validation-token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install pytest PyYAML
      - name: Check feature opt-in and deployment regressions
        run: python -m pytest tests/test_analysis_deployment.py -q
      - name: Validate maintained Compose scenarios
        shell: bash
        run: |
          set -euo pipefail
          files=(
            docker-compose.yml
            docker-compose-dev.yml
            deployment_scenarios/docker-compose-biomero-client.yml
            deployment_scenarios/docker-compose-biomero-only.yml
            deployment_scenarios/docker-compose-for-ubuntu-with-SSL.yml
            deployment_scenarios/docker-compose-from-dockerhub.yml
            deployment_scenarios/docker-compose-importer-only.yml
            deployment_scenarios/docker-compose-with-restored-data.yml
          )
          for file in "${files[@]}"; do
            docker compose --env-file .env --env-file .env.shared \
              -f "$file" config --quiet
          done

  data-query-worker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run authenticated worker cache smoke
        run: python scripts/smoke_data_query_worker.py

  web-image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build released integration web image
        shell: bash
        run: |
          set -a
          source .env
          set +a
          docker build \
            --build-arg OMERO_FORMS_VERSION \
            --build-arg OMERO_BIOMERO_VERSION \
            --build-arg OMERO_ANALYSIS_VERSION \
            --build-arg BIOMERO_WORKFLOW_SKILLS_VERSION \
            --build-arg BIOMERO_ZARR_VIEWER_VERSION \
            --tag nl-biomero-web:ci \
            --file web/Dockerfile \
            .
      - name: Verify installed releases and opt-in behavior
        run: |
          set -a
          source .env
          set +a
          docker run --rm --env OMERO_ANALYSIS_VERSION --env OMERO_BIOMERO_VERSION --env BIOMERO_WORKFLOW_SKILLS_VERSION \
            --volume "$PWD/scripts/smoke_analysis_image.py:/tmp/smoke_analysis_image.py:ro" \
            --entrypoint /opt/omero/web/venv3/bin/python nl-biomero-web:ci /tmp/smoke_analysis_image.py
