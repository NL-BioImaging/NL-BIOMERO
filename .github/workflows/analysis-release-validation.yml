name: Analysis release preparation
on:
  push:
    paths: ['web/Dockerfile', 'web/release/**', 'tests/test_analysis_release.py', '.github/workflows/analysis-release-validation.yml']
  pull_request:
    paths: ['web/Dockerfile', 'web/release/**', 'tests/test_analysis_release.py', '.github/workflows/analysis-release-validation.yml']
permissions:
  contents: read
concurrency:
  group: analysis-release-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  downloader:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install 'pytest>=8,<10'
      - run: python -m pytest tests/test_analysis_release.py -q
